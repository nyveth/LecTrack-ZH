[project]
name = "LecTrack-ZH"
version = "0.1.0"
description = "Lecture transcripts indexing and RAG pipeline"
requires-python = ">=3.13"

# Main production dependencies
dependencies = [
    "fastapi[standard]>=0.139.0",
    "faster-whisper>=1.2.1",
    "openai>=2.50.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.6.0",
    "torch>=2.12.1",
    "uvicorn>=0.50.2",
]

# Configure explicit CPU repository for PyTorch to avoid heavy CUDA wheels
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Bind torch dependency directly to the CPU index
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# Development dependency groups (PEP 735 standard)
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

# Ruff linter and formatter settings
[tool.ruff]
target-version = "py313"

[tool.ruff.lint.isort]
# Treat 'app' as a first-party module to group local imports correctly
known-first-party = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I"]
